services:
  - type: web
    name: zernio-webhook
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: npm start
    envVars:
      - key: ZERNIO_API_KEY
        sync: false
      - key: ZERNIO_WEBHOOK_SECRET
        sync: false
      - key: KEYWORD
        value: Ai
      - key: DM_MESSAGE
        sync: false
      - key: PUBLIC_REPLIES
        sync: false
